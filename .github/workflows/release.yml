name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (no tags yet -> pick minor for the first release, v0.1.0)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build + test gate
        run: |
          go build ./...
          go test ./... -count=1

      - name: Compute next version
        id: ver
        run: |
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          echo "Bumping $latest -> $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.ver.outputs.version }} -o CHANGELOG.md

      - name: Generate this release's notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.ver.outputs.version }} --unreleased --strip header -o notes.md

      - name: Bump version in code
        run: |
          sed -i "s/var version = \".*\"/var version = \"${{ steps.ver.outputs.version }}\"/" cmd/px/main.go

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md cmd/px/main.go
          git commit -m "chore(release): ${{ steps.ver.outputs.version }}"
          git tag "${{ steps.ver.outputs.version }}"
          git push origin HEAD:master
          git push origin "${{ steps.ver.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --title "${{ steps.ver.outputs.version }}" \
            --notes-file notes.md
